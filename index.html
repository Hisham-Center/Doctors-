<script>
(function(){
let lastY=window.scrollY||0,ticking=false;
function syncUtility(){
const bar=document.querySelector('.v12-utility-bar');if(!bar)return;
const y=window.scrollY||0,up=y<lastY-2,down=y>lastY+2;
const nearBottom=window.innerHeight+y>=document.documentElement.scrollHeight-120;
if(up&&y>80)bar.classList.add('v12-hide');
else if(down||nearBottom||y<70)bar.classList.remove('v12-hide');
lastY=y;ticking=false;
}
window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(syncUtility);ticking=true;}},{passive:true});
})();
</script>
<style id="v17-cv-icons">

</style>
