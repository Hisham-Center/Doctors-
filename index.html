.wheel-hint{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:10px;color:var(--blue);box-shadow:0 8px 20px rgba(12,58,95,.08);z-index:6;white-space:nowrap}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.card.compact{overflow:visible;margin-top:22px;background:rgba(255,255,255,.92);position:relative}
.card.compact .portrait{height:245px;overflow:visible}
.card.compact .portrait:before{display:none}
.card.compact .portrait img{height:280px;width:260px;transform:translateY(-22px);filter:drop-shadow(0 17px 16px rgba(17,55,82,.13))}
.card.compact:hover .portrait img{transform:translateY(-30px) scale(1.035)}
.portrait-halo{position:absolute;width:188px;height:188px;border-radius:50%;bottom:12px;background:rgba(255,255,255,.72);box-shadow:0 14px 35px rgba(20,84,154,.08)}
.card.compact .info{text-align:center;padding:4px 14px 19px}
.card.compact .role{min-height:0;margin-top:5px}
.card.compact.selected{border:1.5px solid #78b2ea;box-shadow:0 23px 55px rgba(13,88,167,.16)}
.profile{background:transparent;border:0;box-shadow:none;overflow:visible}
.profile-floating{position:relative;background:rgba(255,255,255,.88);border:1px solid rgba(218,229,238,.95);border-radius:30px;box-shadow:0 22px 60px rgba(12,58,95,.13);overflow:visible}
.profile-floating-photo{height:245px;border-radius:30px 30px 14px 14px;background:radial-gradient(circle at 50% 55%,#eaf7e7,#eef6fb);display:flex;align-items:end;justify-content:center;position:relative;overflow:visible;margin:0 12px}
.profile-floating-photo img{height:310px;width:300px;object-fit:contain;position:relative;z-index:3;transform:translateY(-28px);filter:drop-shadow(0 22px 20px rgba(20,60,90,.16));transition:transform .45s}
.profile-floating:hover .profile-floating-photo img{transform:translateY(-38px) scale(1.05)}
.orbit{position:absolute;border-radius:50%;border:1px solid rgba(13,88,167,.16);z-index:1}
.orbit.o1{width:235px;height:235px}.orbit.o2{width:185px;height:185px;border-color:rgba(85,173,32,.18)}
.profile-floating .profile-content{padding:3px 22px 22px}
.profile-floating .profile-content h3{font-size:28px;margin-top:10px}
.profile-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.profile-summary div{background:#f6fafc;border:1px solid var(--line);border-radius:13px;padding:9px}
.profile-summary b{display:block;color:var(--blue);font-size:10px}.profile-summary span{display:block;color:#637489;font-size:9px;line-height:1.5;margin-top:3px}
.big-action{display:flex;align-items:center;justify-content:center;min-height:44px}

@media(max-width:650px){.hero{min-height:700px}.hero-carousel{height:390px;margin-top:0}.wheel-track{padding-left:30px;padding-right:30px;gap:0}.hero-person{width:160px;flex-basis:160px}.hero-person .hero-pic{height:270px}.hero-person img{height:285px;width:175px}.hero-person.center{transform:translateY(-16px) scale(1.05)}.hero-person.side{transform:translateY(4px) scale(.88)}.hero-person.far{transform:translateY(13px) scale(.75);opacity:.58}.hero-person strong{font-size:14px}.hero-person small{font-size:8px}.wheel-hint{font-size:9px}.grid{display:flex;overflow:auto;scroll-snap-type:x mandatory}.card.compact{min-width:280px;scroll-snap-align:start}.profile-floating-photo{height:260px}.profile-floating-photo img{height:320px;width:300px}.profile-summary{grid-template-columns:1fr}}

.hero-v13-copy p{max-width:500px;font-size:17px;line-height:1.9;color:#35516c;text-align:right}
.hero-v13-actions{justify-content:flex-start;direction:rtl;margin-top:28px}
.hero-v13-actions .btn{min-width:205px}
.hero-v13-wheel{position:absolute;left:35%;right:1%;top:36px;height:505px;z-index:7}
.hero-v13-wheel .hero-carousel{height:100%;background:transparent;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.hero-v13-wheel .wheel-track{padding:22px 30px 66px;gap:0}
.hero-v13-wheel .hero-person{width:235px;flex-basis:235px}
.hero-v13-wheel .hero-person .hero-pic{height:350px}
.hero-v13-wheel .hero-person .hero-pic:before{width:250px;height:250px;bottom:10px;background:rgba(255,255,255,.55);box-shadow:0 18px 45px rgba(20,84,154,.08)}
.hero-v13-wheel .hero-person img{width:230px;height:355px;opacity:.78;filter:drop-shadow(0 16px 17px rgba(20,60,92,.09))}
.hero-v13-wheel .hero-person.center{transform:translateY(-16px) scale(1.13)}
.hero-v13-wheel .hero-person.side{transform:translateY(7px) scale(.92);opacity:.76}
.hero-v13-wheel .hero-person.far{transform:translateY(22px) scale(.78);opacity:.36}
.hero-v13-wheel .hero-person strong{font-size:18px;color:#0b4b85;text-shadow:0 2px 12px rgba(255,255,255,.95)}
.hero-v13-wheel .hero-person small{font-size:11px;color:#5c7082;text-shadow:0 2px 10px rgba(255,255,255,.95)}
.hero-v13-wheel .wheel-fade.left{background:linear-gradient(90deg,rgba(248,252,255,.98),transparent);width:150px}
.hero-v13-wheel .wheel-fade.right{background:linear-gradient(-90deg,rgba(246,251,243,.95),transparent);width:150px}
.hero-v13-wheel .wheel-hint{bottom:7px;font-size:11px;padding:10px 18px;background:rgba(255,255,255,.86)}
.hero-v13-label{display:none}
@media(max-width:900px){
 .hero-v13{min-height:900px}.hero-v13 .container{min-height:900px}.hero-v13-art{min-height:900px}
 .hero-v13-copy{left:24px;right:24px;top:35px;transform:none;width:auto;text-align:center}
 .hero-v13-copy h1,.hero-v13-copy p{text-align:center}.hero-v13-copy p{margin-inline:auto}
 .hero-v13-actions{justify-content:center}
 .hero-v13-wheel{left:0;right:0;top:300px;height:520px}
}
@media(max-width:560px){
 .hero-v13{min-height:790px}.hero-v13 .container,.hero-v13-art{min-height:790px}
 .hero-v13-copy{top:28px}.hero-v13-copy h1{font-size:38px}.hero-v13-copy p{font-size:14px}
 .hero-v13-actions .btn{min-width:165px;font-size:12px}
 .hero-v13-wheel{top:270px;height:460px}.hero-v13-wheel .hero-person{width:175px;flex-basis:175px}.hero-v13-wheel .hero-person .hero-pic{height:290px}.hero-v13-wheel .hero-person .hero-pic:before{width:190px;height:190px}.hero-v13-wheel .hero-person img{width:185px;height:300px}.hero-v13-wheel .hero-person strong{font-size:14px}.hero-v13-wheel .hero-person small{font-size:9px}
}
</style>

function updateAvailability(){

 const today=names[new Date().getDay()], tomorrow=names[(new Date().getDay()+1)%7];

  const d=doctors.find(x=>String(x.id)===String(el.dataset.doctorId)); if(!d)return;
  const days=d.days||[], todayOn=days.includes(today), tomorrowOn=days.includes(tomorrow);

  el.innerHTML=todayOn?"<i></i> متاح اليوم":tomorrowOn?"<i></i> غدًا":"<i></i> غير متاح حاليًا";
 });
}

function initHeroWheel(){
 const c=document.getElementById('heroCarousel'), t=c&&c.querySelector('.wheel-track'); if(!c||!t)return;
 const items=[...t.querySelectorAll('.hero-person')]; let down=false,start=0,base=0,shift=0;
 const update=()=>{
   const cw=c.clientWidth, iw=items[0]?.getBoundingClientRect().width||205;
   const center=cw/2; items.forEach((el,i)=>{
     const r=el.getBoundingClientRect(), ec=r.left+r.width/2, dist=Math.abs(ec-center);
     el.classList.remove('center','side','far');
     if(dist<iw*.62)el.classList.add('center'); else if(dist<iw*1.35)el.classList.add('side'); else el.classList.add('far');
   });
 };
 const move=x=>{t.style.transform=`translateX(${x}px)`;update()};
 c.addEventListener('pointerdown',e=>{down=true;start=e.clientX;base=shift;t.classList.add('dragging');c.setPointerCapture?.(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!down)return;shift=base+(e.clientX-start);move(shift)});
 c.addEventListener('pointerup',e=>{if(!down)return;down=false;t.classList.remove('dragging');let delta=shift-base;if(Math.abs(delta)>35){shift=base+(delta>0?130:-130)}else{shift=base}move(shift)});
 c.addEventListener('pointercancel',()=>{down=false;t.classList.remove('dragging')});
 items.forEach((el,i)=>el.addEventListener('click',()=>{if(Math.abs(shift-base)>35)return;const d=doctors.find(x=>x.id===el.dataset.id);if(d){location.href='?cv='+encodeURIComponent(d.id)}}));

<section class="cv-section"><div class="container cv-grid"><article class="cv-box reveal"><h2>الخبرات والمؤهلات</h2><ul>${d.qual.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="cv-box reveal"><h2>الخدمات والتخصصات</h2><ul>${d.services.map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="cv-box reveal"><h2>مواعيد الدوام</h2><div class="cv-schedule">${d.days.map(x=>`<div class="day"><b>${x}</b><span>${d.hours}</span></div>`).join('')}</div></article><article class="cv-box reveal"><h2>الحالات والمعرض</h2><p class="sub">هذه المساحة جاهزة لإضافة صور حالات مختارة، قبل/بعد، أو شهادات عند الحاجة.</p><div style="margin-top:13px;border:1px dashed #cbd9e3;padding:20px;border-radius:15px;color:#75879a;text-align:center">📷 معرض صور الطبيب يضاف لاحقًا</div></article><article class="cv-box reveal" style="grid-column:1/-1"><h2>بيانات وتواصل</h2><p class="sub">المركز: سوق الخميس - الخميس · ليبيا</p><div class="cv-socials"><a class="cv-social" target="_blank" href="${centerMap}">📍 موقع المركز GPS</a><a class="cv-social" target="_blank" href="${centerFacebook}">Facebook</a><a class="cv-social" target="_blank" href="${centerTikTok}">TikTok</a><a class="cv-social" target="_blank" href="https://wa.me/${centerPhone}">WhatsApp المركز</a><a class="cv-social" href="tel:+${centerPhone}">☎ 0910540235</a></div></article></div></section></main><div class="cv-footerbar"><div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><b>QR Code للـ ID Card</b><div style="color:#c6d8e8;font-size:10px;margin-top:5px">مكان جاهز لربط QR برابط CV النهائي بعد نشر الموقع.</div></div><div style="width:104px;height:104px;background:#fff;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#0e5aad;font-weight:900;font-size:12px;text-align:center;padding:8px">QR<br>يُربط عند النشر</div></div></div>`;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(x=>io.observe(x))}
const params=new URLSearchParams(location.search);const cvId=params.get('cv');const page=params.get('page')||'home';if(cvId){const d=doctors.find(x=>x.id===cvId)||doctors[0];buildCV(d)}else if(page==='doctors'){buildDoctorsPage()}else if(page==='specialties'){buildSpecialtiesPage()}else if(page==='cases'){buildCasesPage()}else if(page==='services'){buildServicesPage()}else if(page==='contact'){buildContactPage()}else{buildHome()}
